name: Cobertura

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: cobertura-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify = testes + relatório + gate de 70% de linhas (jacoco:check).
      # Os testes de integração usam Testcontainers, que já tem Docker no runner.
      - name: Testes e cobertura
        run: ./mvnw -B verify

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: target/site/jacoco
          if-no-files-found: warn

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Falha se statements, branches, functions ou lines ficarem abaixo de 70%.
      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage
          if-no-files-found: warn
