<div class="logs-page">
  <header class="top-bar">
    <a routerLink="/home" class="top-bar__logo" aria-label="Página inicial">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </a>
    <h1 class="top-bar__title">Trilha de auditoria</h1>
    <div class="top-bar__spacer"></div>
  </header>

  <div class="page-content">
    <div class="logs-toolbar">
      <select
        id="filtro-solicitacao"
        class="logs-toolbar__filtro"
        aria-label="Filtrar por solicitação"
        (change)="filtrarPorSolicitacao($any($event.target).value)"
      >
        <option value="">Todas as solicitações</option>
        @for (s of solicitacoes(); track s.id) {
          <option [value]="s.id">{{ s.protocolo }}</option>
        }
      </select>
    </div>

    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }

    <ul class="logs-lista">
      @for (log of logs(); track log.id) {
        <li class="logs-item">
          <span class="logs-item__acao">{{ log.acao }}</span>
          <span class="logs-item__detalhes">{{ log.detalhes }}</span>
          <span class="logs-item__meta">{{ log.usuarioNome ?? 'Sistema' }} · {{ log.dataAcao }}</span>
        </li>
      } @empty {
        @if (!loading() && !error()) {
          <li class="logs-vazio">Nenhum log encontrado.</li>
        }
      }
    </ul>
  </div>
</div>

<app-bottom-nav />
