<div class="nova-solicitacao-page">

  <header class="top-bar">
    <a routerLink="/home" class="top-bar__logo" aria-label="Página inicial">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </a>
    <span class="top-bar__title">Solicitação/Denúncia</span>
    <div class="top-bar__spacer"></div>
  </header>

  <main class="page-content">

    <button class="btn-voltar" (click)="voltar()" aria-label="Voltar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>

    <form [formGroup]="form" class="form-etapa">

      <div class="form-group">
        <label class="form-label" for="categoria">Selecione a Categoria:</label>
        <div class="select-wrapper">
          <select id="categoria" formControlName="categoria" class="form-select">
            <option value="" disabled selected>...</option>
            @for (cat of categorias(); track cat.id) {
              <option [value]="cat.nome">{{ cat.nome }}</option>
            }
          </select>
          <svg class="select-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="descricao">Descreva o Problema:</label>
        <textarea
          id="descricao"
          formControlName="descricao"
          class="form-textarea"
          placeholder="Digite aqui..."
          rows="5"
        ></textarea>
        <p class="form-hint" [class.form-hint--erro]="form.controls.descricao.invalid && form.controls.descricao.touched">
          @if (anonimo) {
            {{ form.value.descricao?.length ?? 0 }}/{{ minDescricao }} caracteres mínimos (denúncia anônima exige mais detalhes)
          } @else {
            {{ form.value.descricao?.length ?? 0 }} caracteres
          }
        </p>
      </div>

      <div class="form-group">
        <label class="form-label" for="pontoReferencia">Ponto de Referência:</label>
        <input
          id="pontoReferencia"
          formControlName="pontoReferencia"
          class="form-input"
          type="text"
          placeholder="Ex: próximo ao mercado, em frente à escola..."
        />
      </div>

    </form>

    <div class="proxima-wrapper">
      <button
        class="btn-proxima"
        [disabled]="form.invalid"
        (click)="proxima()"
      >
        Próxima
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
      </button>
    </div>

  </main>

  <app-bottom-nav />

</div>
